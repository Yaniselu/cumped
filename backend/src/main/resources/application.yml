spring:
  application:
    name: cumped
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cumped}
    username: ${DB_USER:cumped}
    password: ${DB_PASSWORD:cumped}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    # migrările pot rula cu un utilizator separat (proprietarul schemei); aplicația folosește unul doar cu drepturi DML
    user: ${FLYWAY_USER:${DB_USER:cumped}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:cumped}}
  jackson:
    deserialization:
      # câmp necunoscut în JSON = cerere respinsă (nimeni nu poate „strecura” role, status, sellerId etc.)
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # „native” = RemoteIpValve din Tomcat: acceptă X-Forwarded-* doar de la proxy-uri interne (nginx), nu de la oricine
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      tracking-modes: []

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

cumped:
  # Secret pentru semnarea token-urilor (minim 32 de caractere). OBLIGATORIU în producție.
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: PT15M
  refresh-token-ttl: P30D
  cors-origins: ${CORS_ORIGINS:http://localhost:8100,http://localhost:4200}
  cookie-secure: ${COOKIE_SECURE:true}
  uploads-dir: ${UPLOADS_DIR:./uploads}
  support-email: ${SUPPORT_EMAIL:contact@velosyntech.com}
  mail-from: ${MAIL_FROM:no-reply@cumped.com}
  public-url: ${PUBLIC_URL:http://localhost:8100}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic-model: ${ANTHROPIC_MODEL:claude-opus-5-5}
  google-client-ids: ${GOOGLE_CLIENT_IDS:}
  apple-client-ids: ${APPLE_CLIENT_IDS:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  # Doar pentru dezvoltare: simulează verificarea de identitate, SMS-ul și plățile.
  dev-mode: ${DEV_MODE:false}
  demo-data: ${DEMO_DATA:false}
  rate-limit: ${RATE_LIMIT:true}
  # Datele firmei afișate în Termeni, Confidențialitate și „Despre” (obligatorii legal). Completează-le.
  company-name: ${COMPANY_NAME:Velosyntech}
  company-address: ${COMPANY_ADDRESS:}
  company-reg-no: ${COMPANY_REG_NO:}
  company-vat: ${COMPANY_VAT:}
  company-email: ${COMPANY_EMAIL:contact@velosyntech.com}
  data-encryption-key: ${DATA_ENCRYPTION_KEY:}
  turnstile-site-key: ${TURNSTILE_SITE_KEY:}
  turnstile-secret: ${TURNSTILE_SECRET:}
  dpo-email: ${DPO_EMAIL:contact@velosyntech.com}
