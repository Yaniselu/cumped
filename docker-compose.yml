# Pornire locală completă: docker compose up --build  →  http://localhost:8100
# Producție (HTTPS automat cu Let's Encrypt, HTTP → HTTPS):  DOMAIN=cumped.com docker compose --profile https up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cumped
      POSTGRES_USER: cumped
      POSTGRES_PASSWORD: ${DB_PASSWORD:?seteaza DB_PASSWORD in .env}
    # baza de date nu e expusă în afara rețelei interne (fără "ports")
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cumped"], interval: 5s, retries: 10 }
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/cumped
      DB_USER: cumped
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build: ./frontend
    # doar local (127.0.0.1): din internet se intră numai prin proxy-ul HTTPS de mai jos
    ports: ["127.0.0.1:8100:80"]
    depends_on: [backend]
    restart: unless-stopped

  https:
    image: caddy:2-alpine
    profiles: [https]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?seteaza DOMAIN, ex. cumped.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  db:
  uploads:
  caddy:
