<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Cumped — vinde și cumpără fără frică</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Cumped: platforma de anunțuri cu oameni verificați, preț analizat de AI și chat protejat anti-țeapă." />
  <meta name="theme-color" content="#ececef" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Ecranul de pornire: apare imediat (înainte de cod), dispare când aplicația e gata. -->
  <style>
    .boot { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(60% 50% at 50% 40%, #241a5e 0%, #0b0a12 70%); color: #fff; overflow: hidden;
      font-family: 'Familjen Grotesk Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .boot-halo { position: absolute; width: 460px; height: 460px; border-radius: 50%; opacity: .55; will-change: transform;
      background: radial-gradient(closest-side at 32% 36%, rgba(91, 61, 245, .95), transparent),
        radial-gradient(closest-side at 70% 42%, rgba(255, 90, 78, .8), transparent),
        radial-gradient(closest-side at 48% 72%, rgba(123, 92, 255, .9), transparent);
      animation: bootSpin 6s linear infinite; }
    .boot-mark { position: relative; filter: drop-shadow(0 18px 40px rgba(91, 61, 245, .45)); animation: bootPop .9s cubic-bezier(.34, 1.56, .64, 1) both; }
    .boot-mark .ar { transform-origin: 256px 256px; animation: bootArrows 1.4s cubic-bezier(.22, 1, .36, 1) both; }
    .boot-mark .ck { stroke-dasharray: 160; stroke-dashoffset: 160; animation: bootDraw .7s .7s cubic-bezier(.22, 1, .36, 1) forwards; }
    .boot-word { position: relative; font-weight: 700; font-size: 38px; letter-spacing: -0.03em; animation: bootUp .8s .45s cubic-bezier(.34, 1.56, .64, 1) both; }
    .boot-tag { position: relative; display: flex; gap: 8px; color: rgba(255, 255, 255, .72); font-size: 16px; font-weight: 550; }
    .boot-tag span { animation: bootUp .7s cubic-bezier(.34, 1.56, .64, 1) both; }
    .boot-tag span:nth-child(1) { animation-delay: .75s; } .boot-tag span:nth-child(2) { animation-delay: .9s; } .boot-tag span:nth-child(3) { animation-delay: 1.05s; color: #ff8a7f; }
    .boot-bar { position: absolute; bottom: calc(56px + env(safe-area-inset-bottom)); width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(255, 255, 255, .12); opacity: 0; animation: bootFade .4s 2.2s forwards; }
    .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7b5cff, #ff5a4e); animation: bootSlide 1.1s ease-in-out infinite; }
    .boot-slow { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); font: 500 14px system-ui, sans-serif; color: rgba(255, 255, 255, .6); opacity: 0; animation: bootFade .4s 12s forwards; }
    .boot.out { pointer-events: none; animation: bootOut .6s cubic-bezier(.6, 0, .4, 1) forwards; }
    .boot.out .boot-mark { animation: bootZoom .6s cubic-bezier(.6, 0, .4, 1) forwards; }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootPop { from { opacity: 0; transform: scale(.6); } }
    @keyframes bootArrows { from { opacity: 0; transform: rotate(-200deg) scale(.6); } }
    @keyframes bootDraw { to { stroke-dashoffset: 0; } }
    @keyframes bootUp { from { opacity: 0; transform: translateY(14px); } }
    @keyframes bootFade { to { opacity: 1; } }
    @keyframes bootSlide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes bootOut { to { opacity: 0; visibility: hidden; } }
    @keyframes bootZoom { to { transform: scale(1.35); filter: blur(6px); } }
    @media (prefers-reduced-motion: reduce) { .boot *, .boot { animation-duration: 1ms !important; animation-delay: 0s !important; } .boot-bar, .boot-slow { display: none; } }
  </style>
</head>
<body>
  <!-- Refracția „Liquid Glass”: deformare fină a fundalului văzut prin sticlă -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="11" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" result="refracted" />
      <feGaussianBlur in="refracted" stdDeviation="1.6" />
    </filter>
  </svg>
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-halo"></div>
    <svg class="boot-mark" width="108" height="108" viewBox="0 0 512 512">
      <rect x="2" y="2" width="508" height="508" rx="114" fill="#141416" />
      <g class="ar">
        <path d="M136.07 251.81 A120 120 0 0 1 354.30 187.17" fill="none" stroke="#FF5A4E" stroke-width="44" stroke-linecap="round" />
        <path d="M391.98 160.78 L386.42 233.04 L316.62 213.56 Z" fill="#FF5A4E" stroke="#FF5A4E" stroke-width="10" stroke-linejoin="round" />
        <path d="M375.93 260.19 A120 120 0 0 1 157.70 324.83" fill="none" stroke="#7B5CFF" stroke-width="44" stroke-linecap="round" />
        <path d="M120.02 351.22 L125.58 278.96 L195.38 298.44 Z" fill="#7B5CFF" stroke="#7B5CFF" stroke-width="10" stroke-linejoin="round" />
      </g>
      <polyline class="ck" points="208,258 242,292 306,224" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="boot-word">Cumped</div>
    <div class="boot-tag"><span>Vinde.</span><span>Cumpără.</span><span>Fără frică.</span></div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-slow">Se încarcă greu… verifică internetul.</div>
  </div>
  <noscript><p style="position:fixed;inset:auto 0 40px;z-index:10001;text-align:center;color:#fff;font:500 15px system-ui">Cumped are nevoie de JavaScript activat.</p></noscript>
  <app-root></app-root>
</body>
</html>
