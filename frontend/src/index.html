<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Cumped — vinde și cumpără fără frică</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Cumped: platforma de anunțuri cu oameni verificați, preț analizat de AI și chat protejat anti-țeapă." />
  <meta name="theme-color" content="#ececef" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <!-- Refracția „Liquid Glass”: deformare fină a fundalului văzut prin sticlă -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="11" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" result="refracted" />
      <feGaussianBlur in="refracted" stdDeviation="1.6" />
    </filter>
  </svg>
  <app-root></app-root>
</body>
</html>
