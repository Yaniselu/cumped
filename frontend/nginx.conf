# Site + API pe același domeniu: cookie-ul de sesiune poate fi SameSite=Strict, fără CORS.
# Protocolul real al clientului: de la proxy-ul HTTPS din față (Caddy/Cloudflare), altfel cel al conexiunii.
map $http_x_forwarded_proto $client_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;

  # IP-ul real al clientului vine DOAR de la proxy-ul din rețeaua internă Docker (Caddy), nu de la oricine.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  # HTTPS obligatoriu: orice cerere venită prin HTTP la proxy e redirecționată.
  set $redirect_https "";
  if ($client_proto = "http") {
    set $redirect_https "1";
  }
  if ($host ~* "^(localhost|127\.0\.0\.1)$") {
    set $redirect_https "";
  }
  if ($redirect_https = "1") {
    return 301 https://$host$request_uri;
  }
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 10m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # suprascriem (nu adăugăm): clientul nu poate falsifica IP-ul văzut de server prin X-Forwarded-For
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_proto;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
